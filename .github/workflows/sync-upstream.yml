name: Sync with upstream

on:
  schedule:
    # Every night at 02:17 UTC.
    # Avoiding :00 reduces the chance of GitHub Actions scheduling delays.
    - cron: "17 2 * * *"

  # Also allow a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/embassy-rs/embassy.git
          git fetch upstream main

      - name: Decide whether to sync
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          SPECIAL_FILE="embassy-rp/src/time_driver.rs"

          FORK_HEAD="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse upstream/main)"
          BASE="$(git merge-base HEAD upstream/main)"

          echo "Fork HEAD:     $FORK_HEAD"
          echo "Upstream HEAD: $UPSTREAM_HEAD"
          echo "Common base:   $BASE"

          # Nothing new upstream.
          if [ "$BASE" = "$UPSTREAM_HEAD" ]; then
            echo "Upstream has no new changes."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check whether the special file's FINAL CONTENT changed
          # between the last common ancestor and upstream/main.
          if ! git diff --quiet "$BASE" "$UPSTREAM_HEAD" -- "$SPECIAL_FILE"; then
            echo "::warning::Upstream changed $SPECIAL_FILE."
            echo "Fork will NOT be synchronized."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check whether anything else has changed persistently
          # between the last common ancestor and upstream/main.
          OTHER_CHANGES="$(git diff --name-only "$BASE" "$UPSTREAM_HEAD" -- . \
            ":(exclude)$SPECIAL_FILE")"

          if [ -z "$OTHER_CHANGES" ]; then
            echo "No persistent upstream changes outside $SPECIAL_FILE."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Persistent upstream changes detected:"
          echo "$OTHER_CHANGES"

          echo "sync=true" >> "$GITHUB_OUTPUT"

            - name: Merge upstream
        if: steps.decide.outputs.sync == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-edit upstream/main
