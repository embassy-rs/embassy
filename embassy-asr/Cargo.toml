[package]
name = "embassy-asr"
version = "0.1.0"
edition = "2024"
description = "Embassy Hardware Abstraction Layer (HAL) for ASR6601 microcontrollers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-asr"
keywords = ["embedded", "async", "asr6601", "hal", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
publish = false

[package.metadata.embassy]
build = [
    { target = "thumbv7em-none-eabihf", features = ["defmt", "asr6601", "time-driver-lptim0"] },
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-asr-v$VERSION/embassy-asr/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-asr/src/"

features = ["defmt", "asr6601", "time-driver-lptim0"]
flavors = [
    { regex_feature = "asr6601", target = "thumbv7em-none-eabihf" },
]

[package.metadata.docs.rs]
features = ["defmt", "asr6601", "time-driver-lptim0"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
embassy-embedded-hal = { version = "0.6.0", path = "../embassy-embedded-hal", default-features = false }
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal", features = ["cortex-m", "prio-bits-3"] }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-time = { version = "0.5.1", path = "../embassy-time", default-features = false }
embassy-time-driver = { version = "0.2.2", path = "../embassy-time-driver", optional = true }
embassy-time-queue-utils = { version = "0.3.2", path = "../embassy-time-queue-utils", optional = true }

embedded-hal = "1.0"
embedded-hal-02 = { package = "embedded-hal", version = "0.2.6", features = ["unproven"] }
embedded-hal-async = "1.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"
rand_core = "0.9"

defmt = { version = "1.0.1", optional = true }
cortex-m = "0.7"
cortex-m-rt = "0.7"
critical-section = "1.1"

[dependencies.asr6601-pac]
version = "0.1.2"
optional = true
features = ["critical-section", "rt"]

[features]
default = ["asr6601"]

defmt = [
    "dep:defmt",
    "embassy-embedded-hal/defmt",
    "embassy-futures/defmt",
    "embassy-hal-internal/defmt",
    "embassy-sync/defmt",
]

_time-driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils"]

# LPTIM0 is clocked from the always-on XO32K domain. Its 16-bit counter
# provides the monotonic clock and its compare channel wakes the processor.
time-driver-lptim0 = [
    "_time-driver",
    "asr6601",
    "embassy-time-driver?/tick-hz-32_768",
]

rt = []
asr6601 = ["dep:asr6601-pac", "rt"]
