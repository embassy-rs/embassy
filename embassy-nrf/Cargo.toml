[package]
name = "embassy-nrf"
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Embassy Hardware Abstraction Layer (HAL) for nRF series microcontrollers"
keywords = ["embedded", "async", "nordic", "nrf", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-nrf"

[package.metadata.embassy]
build = [
    {target = "thumbv6m-none-eabi", features = ["gpiote", "nrf51", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nrf52805", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nrf52810", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nrf52811", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nrf52820", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nrf52832", "reset-pin-as-gpio", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nrf52833", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nfc-pins-as-gpio", "nrf52833", "time", "time-driver-rtc1"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf9160-s", "time", "time-driver-rtc1"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf9160-ns", "time", "time-driver-rtc1"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf5340-app-s", "time", "time-driver-rtc1"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf5340-app-ns", "time", "time-driver-rtc1"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf5340-net", "time", "time-driver-rtc1"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l15-app-s", "time", "time-driver-grtc"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l15-app-ns", "time", "time-driver-grtc"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l10-app-s", "time", "time-driver-grtc"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l10-app-ns", "time", "time-driver-grtc"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l05-app-s", "time", "time-driver-grtc"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l05-app-ns", "time", "time-driver-grtc"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54lm20-app-s", "time", "time-driver-grtc"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l15-app-s", "time", "time-driver-grtc", "nfc-pins-as-gpio"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l15-app-ns", "time", "time-driver-grtc", "nfc-pins-as-gpio"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l10-app-s", "time", "time-driver-grtc", "nfc-pins-as-gpio"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l10-app-ns", "time", "time-driver-grtc", "nfc-pins-as-gpio"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l05-app-s", "time", "time-driver-grtc", "nfc-pins-as-gpio"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54l05-app-ns", "time", "time-driver-grtc", "nfc-pins-as-gpio"]},
    {target = "thumbv8m.main-none-eabihf", features = ["gpiote", "nrf54lm20-app-s", "time", "time-driver-grtc", "nfc-pins-as-gpio"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nrf52840", "time"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nrf52840", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "nrf52840", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "log", "nrf52840", "time"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "log", "nrf52840", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["gpiote", "log", "nrf52840", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "gpiote", "nrf52840", "time"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "gpiote", "nrf52840", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "gpiote", "nrf52840", "time", "time-driver-rtc1"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "gpiote", "nrf52840", "time", "time-driver-rtc1","qspi-multiwrite-flash"]},
    {target = "thumbv6m-none-eabi", features = ["defmt", "nrf51", "time", "time-driver-rtc1"]},
    {target = "thumbv6m-none-eabi", features = ["defmt", "nrf51", "time"]},
    {target = "thumbv6m-none-eabi", features = ["nrf51", "time"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-nrf-v$VERSION/embassy-nrf/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-nrf/src/"

features = ["time", "defmt", "unstable-pac", "gpiote", "time-driver-rtc1"]
flavors = [
    { regex_feature = "nrf51", target = "thumbv6m-none-eabi" },
    { regex_feature = "nrf52.*", target = "thumbv7em-none-eabihf" },
    { regex_feature = "nrf53.*", target = "thumbv8m.main-none-eabihf" },
    { regex_feature = "nrf54.*", target = "thumbv8m.main-none-eabihf" },
    { regex_feature = "nrf91.*", target = "thumbv8m.main-none-eabihf" },
]

[package.metadata.docs.rs]
features = ["nrf52840", "time", "defmt", "unstable-pac", "gpiote", "time-driver-rtc1"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rt"]
## Cortex-M runtime (enabled by default)
rt = ["nrf-pac/rt"]

## Enable features requiring `embassy-time`
time = ["dep:embassy-time", "embassy-embedded-hal/time"]

## Enable defmt
defmt = [
    "dep:defmt",
    "embassy-hal-internal/defmt",
    "embassy-sync/defmt",
    "embassy-usb-driver/defmt",
    "embassy-usb-synopsys-otg/defmt",
    "embassy-embedded-hal/defmt",
    "embassy-crypto/defmt",
]
## Enable log
log = ["dep:log"]

## Reexport the PAC for the currently enabled chip at `embassy_nrf::pac` (unstable)
unstable-pac = []
# This is unstable because semver-minor (non-breaking) releases of embassy-nrf may major-bump (breaking) the PAC version.
# If this is an issue for you, you're encouraged to directly depend on a fixed version of the PAC.
# There are no plans to make this stable.

## Enable GPIO tasks and events
gpiote = []

## Use RTC1 as the time driver for `embassy-time`, with a tick rate of 32.768khz
time-driver-rtc1 = ["_time-driver", "embassy-time-driver?/tick-hz-32_768"]

## Use GRTC as the time driver for `embassy-time`, with a tick rate of 1 MHz.
## Defaults to CC11. Select at most one `time-driver-grtc-ccN` feature to choose a channel.
## The interrupt follows the security domain: GRTC_1 for non-secure, GRTC_2 for secure.
time-driver-grtc = ["_time-driver", "embassy-time-driver?/tick-hz-1_000_000"]

## Use GRTC CC0 for the time driver.
time-driver-grtc-cc0 = ["time-driver-grtc"]
## Use GRTC CC1 for the time driver.
time-driver-grtc-cc1 = ["time-driver-grtc"]
## Use GRTC CC2 for the time driver.
time-driver-grtc-cc2 = ["time-driver-grtc"]
## Use GRTC CC3 for the time driver.
time-driver-grtc-cc3 = ["time-driver-grtc"]
## Use GRTC CC4 for the time driver.
time-driver-grtc-cc4 = ["time-driver-grtc"]
## Use GRTC CC5 for the time driver.
time-driver-grtc-cc5 = ["time-driver-grtc"]
## Use GRTC CC6 for the time driver.
time-driver-grtc-cc6 = ["time-driver-grtc"]
## Use GRTC CC7 for the time driver.
time-driver-grtc-cc7 = ["time-driver-grtc"]
## Use GRTC CC8 for the time driver.
time-driver-grtc-cc8 = ["time-driver-grtc"]
## Use GRTC CC9 for the time driver.
time-driver-grtc-cc9 = ["time-driver-grtc"]
## Use GRTC CC10 for the time driver.
time-driver-grtc-cc10 = ["time-driver-grtc"]
## Use GRTC CC11 for the time driver.
time-driver-grtc-cc11 = ["time-driver-grtc"]

## Enable embassy-net 802.15.4 driver
net-driver = ["_net-driver"]

## Allow using the NFC pins as regular GPIO pins (P0_09/P0_10 on nRF52, P0_02/P0_03 on nRF53)
nfc-pins-as-gpio = []

## Allow using the RST pin as a regular GPIO pin.
##  * nRF52805, nRF52810, nRF52811, nRF52832: P0_21
##  * nRF52820, nRF52833, nRF52840: P0_18
reset-pin-as-gpio = []

## Allow using the LFXO pins as regular GPIO pins (P0_00/P0_01 on nRF53)
lfxo-pins-as-gpio = []

## Implements the MultiwriteNorFlash trait for QSPI. Should only be enabled if your external
## flash supports the semantics described [here](https://docs.rs/embedded-storage/0.3.1/embedded_storage/nor_flash/trait.MultiwriteNorFlash.html)
qspi-multiwrite-flash = []

## Register the hardware driver for one `embassy-crypto` operation, served by
## the CryptoCell or CRACEN accelerator. See the `embassy-crypto` documentation.
## Nothing is registered for chips that lack the accelerator or the algorithm.
##
## Enabling any of these takes the symmetric engines over for `embassy-crypto`:
## the `CRYPTO_SYMMETRIC` peripheral singleton is removed from `Peripherals`, so
## the engines cannot also be driven through `crypto::symmetric::Symmetric`.
embassy-crypto-md5 = []
embassy-crypto-sha1 = ["_embassy-crypto-symmetric"]
embassy-crypto-sha224 = ["_embassy-crypto-symmetric"]
embassy-crypto-sha256 = ["_embassy-crypto-symmetric"]
embassy-crypto-sha384 = ["_embassy-crypto-symmetric"]
embassy-crypto-sha512 = ["_embassy-crypto-symmetric"]
embassy-crypto-sha512-224 = ["_embassy-crypto-symmetric"]
embassy-crypto-sha512-256 = ["_embassy-crypto-symmetric"]
embassy-crypto-hmac-sha1 = ["_embassy-crypto-symmetric"]
embassy-crypto-hmac-sha224 = ["_embassy-crypto-symmetric"]
embassy-crypto-hmac-sha256 = ["_embassy-crypto-symmetric"]
embassy-crypto-hmac-sha384 = ["_embassy-crypto-symmetric"]
embassy-crypto-hmac-sha512 = ["_embassy-crypto-symmetric"]
embassy-crypto-hmac-sha512-224 = ["_embassy-crypto-symmetric"]
embassy-crypto-hmac-sha512-256 = ["_embassy-crypto-symmetric"]
embassy-crypto-aes128-ecb = ["_embassy-crypto-symmetric"]
embassy-crypto-aes128-cbc = ["_embassy-crypto-symmetric"]
embassy-crypto-aes128-ctr = ["_embassy-crypto-symmetric"]
embassy-crypto-aes128-gcm = ["_embassy-crypto-symmetric"]
embassy-crypto-aes128-ccm = ["_embassy-crypto-symmetric"]
embassy-crypto-aes128-cmac = ["_embassy-crypto-symmetric"]
embassy-crypto-aes256-ecb = ["_embassy-crypto-symmetric"]
embassy-crypto-aes256-cbc = ["_embassy-crypto-symmetric"]
embassy-crypto-aes256-ctr = ["_embassy-crypto-symmetric"]
embassy-crypto-aes256-gcm = ["_embassy-crypto-symmetric"]
embassy-crypto-aes256-ccm = ["_embassy-crypto-symmetric"]
embassy-crypto-aes256-cmac = ["_embassy-crypto-symmetric"]
## ChaCha8, ChaCha12 and their Poly1305 AEADs are only served on the CryptoCell.
embassy-crypto-chacha8 = ["_embassy-crypto-symmetric"]
embassy-crypto-chacha12 = ["_embassy-crypto-symmetric"]
embassy-crypto-chacha20 = ["_embassy-crypto-symmetric"]
embassy-crypto-chacha8-poly1305 = ["_embassy-crypto-symmetric"]
embassy-crypto-chacha12-poly1305 = ["_embassy-crypto-symmetric"]
embassy-crypto-chacha20-poly1305 = ["_embassy-crypto-symmetric"]
## Register the hardware driver for random numbers, served by the CRACEN TRNG on
## nRF54L, the CryptoCell TRNG on nRF52840, nRF5340 and nRF91, and the RNG
## peripheral elsewhere. See the `embassy-crypto` documentation. The driver takes
## the generator over: the `CRYPTO_RNG` (or, without an accelerator, `RNG`)
## peripheral singleton is removed from `Peripherals`. Nothing is registered in Non-Secure builds of the
## nRF5340, nRF54L and nRF91, which cannot reach the entropy source.
embassy-crypto-rng = []
## Register the hardware driver for P-256 arithmetic, served by the public key
## engine. The driver takes the engine over: the `CRYPTO_PKA` peripheral singleton
## is removed from `Peripherals`. On CRACEN the engine's microcode must be
## registered with `crypto::pka::set_microcode`.
embassy-crypto-p256-arith = ["_embassy-crypto-pka"]
## Register the hardware driver for P-256 ECDH, served by the public key engine.
## See `embassy-crypto-p256-arith`.
embassy-crypto-p256-ecdh = ["_embassy-crypto-pka"]
## Register the hardware driver for P-256 ECDSA, served by the public key engine.
## Signing draws the nonce from the `embassy-crypto` RNG driver. See
## `embassy-crypto-p256-arith`.
embassy-crypto-p256-ecdsa = ["_embassy-crypto-pka"]
## Register the hardware driver for P-384 arithmetic, served by the public key
## engine. See `embassy-crypto-p256-arith`.
embassy-crypto-p384-arith = ["_embassy-crypto-pka"]
## Register the hardware driver for P-384 ECDH, served by the public key engine.
## See `embassy-crypto-p256-arith`.
embassy-crypto-p384-ecdh = ["_embassy-crypto-pka"]
## Register the hardware driver for P-384 ECDSA, served by the public key engine.
## See `embassy-crypto-p256-ecdsa`.
embassy-crypto-p384-ecdsa = ["_embassy-crypto-pka"]

#! ### Chip selection features
## nRF51
nrf51 = ["nrf-pac/nrf51", "_nrf51", "_spi-v1"]
## nRF52805
nrf52805 = ["nrf-pac/nrf52805", "_nrf52", "_spi-v1"]
## nRF52810
nrf52810 = ["nrf-pac/nrf52810", "_nrf52", "_spi-v1"]
## nRF52811
nrf52811 = ["nrf-pac/nrf52811", "_nrf52", "_spi-v1"]
## nRF52820
nrf52820 = ["nrf-pac/nrf52820", "_nrf52", "_spi-v1"]
## nRF52832
nrf52832 = ["nrf-pac/nrf52832", "_nrf52", "_nrf52832_anomaly_109", "_spi-v1"]
## nRF52833
nrf52833 = ["nrf-pac/nrf52833", "_nrf52", "_gpio-p1"]
## nRF52840
nrf52840 = ["nrf-pac/nrf52840", "_nrf52", "_gpio-p1", "_cryptocell"]
## nRF5340 application core in Secure mode
nrf5340-app-s = ["_nrf5340-app", "_s", "_cryptocell", "_cryptocell-312"]
## nRF5340 application core in Non-Secure mode
nrf5340-app-ns = ["_nrf5340-app", "_ns"]
## nRF5340 network core
nrf5340-net = ["_nrf5340-net"]
## nRF54L15 application core in Secure mode
nrf54l15-app-s = ["_nrf54l15-app", "_s", "_multi_wdt", "_cracen"]
## nRF54L15 application core in Non-Secure mode
nrf54l15-app-ns = ["_nrf54l15-app", "_ns"]
## nRF54L10 application core in Secure mode
nrf54l10-app-s = ["_nrf54l10-app", "_s", "_multi_wdt", "_cracen"]
## nRF54L10 application core in Non-Secure mode
nrf54l10-app-ns = ["_nrf54l10-app", "_ns"]
## nRF54L05 application core in Secure mode
nrf54l05-app-s = ["_nrf54l05-app", "_s", "_multi_wdt", "_cracen"]
## nRF54L05 application core in Non-Secure mode
nrf54l05-app-ns = ["_nrf54l05-app", "_ns"]
## nRF54LM20 application core in Secure mode
nrf54lm20-app-s = ["_nrf54lm20-app", "_s", "_multi_wdt", "_cracen"]

## nRF9160 in Secure mode
nrf9160-s = ["_nrf9160", "_s", "_nrf91", "_cryptocell"]
## nRF9160 in Non-Secure mode
nrf9160-ns = ["_nrf9160", "_ns", "_nrf91"]
## The nRF9120 is the internal part number for the nRF9161 and nRF9151.
## nRF9120 in Secure mode
nrf9120-s = ["_nrf9120", "_s", "_nrf91", "_cryptocell"]
nrf9151-s = ["nrf9120-s"]
nrf9161-s = ["nrf9120-s"]
## nRF9120 in Non-Secure mode
nrf9120-ns = ["_nrf9120", "_ns", "_nrf91"]
nrf9151-ns = ["nrf9120-ns"]
nrf9161-ns = ["nrf9120-ns"]

# Features starting with `_` are for internal use only. They're not intended
# to be enabled by other crates, and are not covered by semver guarantees.

_nrf5340-app = ["_nrf5340", "_multi_wdt", "nrf-pac/nrf5340-app"]
_nrf5340-net = ["_nrf5340", "nrf-pac/nrf5340-net"]
_nrf5340 = ["_gpio-p1", "_dppi"]
_nrf54l15-app = ["_nrf54l15", "nrf-pac/nrf54l15-app"]
_nrf54l15 = ["_nrf54l", "_gpio-p1", "_gpio-p2"]
_nrf54l10-app = ["_nrf54l10", "nrf-pac/nrf54l10-app"]
_nrf54l10 = ["_nrf54l", "_gpio-p1", "_gpio-p2"]
_nrf54l05-app = ["_nrf54l05", "nrf-pac/nrf54l05-app"]
_nrf54l05 = ["_nrf54l", "_gpio-p1", "_gpio-p2"]
_nrf54lm20-app = ["_nrf54lm20", "nrf-pac/nrf54lm20a-app"]
_nrf54lm20 = ["_nrf54l", "_gpio-p1", "_gpio-p2", "_gpio-p3", "dep:embassy-usb-synopsys-otg"]
_nrf54l = ["_dppi", "_grtc"]

_nrf9160 = ["nrf-pac/nrf9160", "_dppi", "_spi-v1"]
_nrf9120 = ["nrf-pac/nrf9120", "_dppi", "_spi-v1"]
_nrf52 = ["_ppi"]
_nrf51 = ["_ppi", "_spi-v1"]
_nrf91 = []

# Crypto accelerators
_cryptocell = []
_cryptocell-312 = []
_cracen = []
_embassy-crypto-symmetric = []
_embassy-crypto-pka = ["dep:crypto-bigint"]

_time-driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils", "embassy-embedded-hal/time"]

_net-driver = ["dep:embassy-net-driver-channel"]

# trustzone state.
_s = []
_ns = []

_ppi = []
_dppi = []
_gpio-p1 = []
_gpio-p2 = []
_gpio-p3 = []
_spi-v1 = []
_grtc = []

# Errata workarounds
_nrf52832_anomaly_109 = []

# watchdog timer
_multi_wdt = []

[dependencies]
embassy-time-driver = { version = "0.2.2", path = "../embassy-time-driver", optional = true }
embassy-time-queue-utils = { version = "0.3.2", path = "../embassy-time-queue-utils", optional = true }
embassy-time = { version = "0.5.1", path = "../embassy-time", optional = true }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal", features = ["cortex-m", "prio-bits-3"] }
embassy-embedded-hal = { version = "0.6.0", path = "../embassy-embedded-hal", default-features = false }
embassy-usb-driver = { version = "0.2.2", path = "../embassy-usb-driver" }
embassy-usb-synopsys-otg = { version = "0.4.0", path = "../embassy-usb-synopsys-otg", optional = true }
embassy-net-driver-channel = { version = "0.4.0", path = "../embassy-net-driver-channel", optional = true}
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
embassy-crypto = { version = "0.1.0", path = "../embassy-crypto" }
crypto-bigint = { version = "0.7.5", default-features = false, optional = true }

embedded-hal-02 = { package = "embedded-hal", version = "0.2.6", features = ["unproven"] }
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }

rand-core-06 = { package = "rand_core", version = "0.6" }
rand-core-09 = { package = "rand_core", version = "0.9" }
rand-core-10 = { package = "rand_core", version = "0.10" }

# nrf-pac = "0.4.0"
nrf-pac = { git = "https://github.com/embassy-rs/nrf-pac", rev = "4499375510e2fdb3a5426911beb846d8d2dbbb80" }

defmt = { version = "1.0.1", optional = true }
thiserror = { version = "2", default-features = false }
bitflags = "2.10.0"
log = { version = "0.4.14", optional = true }
cortex-m-rt = ">=0.6.15,<0.8"
cortex-m = "0.7.6"
critical-section = "1.1"
fixed = "1.10.0"
embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"
cfg-if = "1.0.0"
document-features = "0.2.7"
