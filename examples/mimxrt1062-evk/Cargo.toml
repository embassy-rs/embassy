[package]
name = "embassy-imxrt1062-evk-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"
defmt = "1.0.1"
defmt-rtt = "1.0.0"

embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-nxp = { version = "0.1.0", path = "../../embassy-nxp", features = ["defmt", "mimxrt1062", "unstable-pac", "time-driver-pit"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", ] } # "defmt-timestamp-uptime"

imxrt-boot-gen = "0.4.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
panic-semihosting = "0.7.0"

[build-dependencies]
imxrt-rt = { version = "0.1.7", features = ["device"] }

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabihf", artifact-dir = "out/examples/mimxrt1062-evk" }
]
