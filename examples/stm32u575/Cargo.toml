[package]
edition = "2024"
name = "embassy-stm32u575-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Change stm32u575ci to your chip name, if necessary.
embassy-stm32 = { version = "0.6.0", path = "../../embassy-stm32", features = ["defmt", "unstable-pac", "stm32u575ci", "time-driver-any", "memory-x", "exti"] }
embassy-sync = { version = "0.8.0", path = "../../embassy-sync", features = ["defmt"] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embassy-embedded-hal = { version = "0.6.0", path = "../../embassy-embedded-hal" }
embassy-net-adin1110 = { version = "0.4.0", path = "../../embassy-net-adin1110", default-features = false, features = ["tc6", "defmt"] }
embassy-net = { version = "0.9.1", path = "../../embassy-net", features = ["defmt", "udp", "tcp", "proto-ipv6", "medium-ethernet"] }

embedded-io = { version = "0.7.0", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "0.2.6"
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.1", features = ["async", "defmt-03"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = { version = "0.9", default-features = false }
static_cell = "2"
pca9535 = "2.0.0"

[features]
## Use secure registers when TrustZone is enabled
trustzone-secure = ["embassy-stm32/trustzone-secure"]

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/stm32u575" }
]
