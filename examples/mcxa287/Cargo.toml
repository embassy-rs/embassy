[package]
name = "embassy-mcxa287-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["set-sp", "set-vtor"] }
crc = "3.4.0"
defmt = "1.0"
defmt-rtt = "1.0"
embassy-embedded-hal = { version = "0.6.0", path = "../../embassy-embedded-hal" }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", default-features = false, features = ["executor-thread", "defmt"] }
embassy-mcxa = { version = "0.1.0", path = "../../embassy-mcxa", features = ["defmt", "unstable-pac", "mcxa287"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-io-async = "0.7.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
rand_core = "0.10"
static_cell = "2.1.1"

[features]
default = ["default-executor"]
default-executor = ["embassy-executor/platform-cortex-m"]
executor-platform = ["embassy-mcxa/executor-platform"]
time-driver-lptmr = ["embassy-mcxa/time-driver-lptmr"]

[[bin]]
name = "time-driver-lptmr"
path = "src/bin/time-driver-lptmr.rs"
required-features = ["time-driver-lptmr"]

[profile.release]
lto = true
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/mcxa287" }
]
