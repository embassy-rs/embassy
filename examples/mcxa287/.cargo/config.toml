[target.thumbv8m.main-none-eabihf]
runner = 'probe-rs run --chip MCXA287 --preverify --verify --protocol swd --speed 12000'

rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "trace"
