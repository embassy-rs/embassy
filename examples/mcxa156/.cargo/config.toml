[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = 'probe-rs run --chip MCXA156 --preverify --verify --protocol swd --speed 4000'

rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "info"
