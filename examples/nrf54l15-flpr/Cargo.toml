[package]
edition = "2024"
name = "embassy-nrf54l15-flpr-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
nrf-pac = { git = "https://github.com/embassy-rs/nrf-pac", rev = "8a9f841b2378f0697d2831670eda515cda990d1c", features = ["nrf54l15-flpr"] }
panic-halt = "1.0"
embedded-hal = "1.0"

riscv = { version = "0.16.0", features = ["critical-section-single-hart"] }
riscv-rt = { version = "0.18.0", features = ["single-hart"] }

[package.metadata.embassy]
build = [
    {group = "nightly", target = "riscv32emc-unknown-none-elf", "build-std" = ["core", "compiler_builtins"], artifact-dir = "out/examples/nrf54l15-flpr"}
]
