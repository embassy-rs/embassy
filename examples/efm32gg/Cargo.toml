[package]
name = "embassy-efm32gg-examples"
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-silabs   = { path = "../../embassy-silabs", features = ["defmt", "efm32gg990f1024", "time-driver-rtc", "unstable-pac"] }
embassy-sync     = { path = "../../embassy-sync", features = ["defmt"] }
embassy-executor = { path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread", "defmt"] }
# The tick rate comes from `time-driver-rtc` (32768 Hz).
embassy-time     = { path = "../../embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures  = { path = "../../embassy-futures" }
# The linker script comes from the metapac (`memory-x`).
silabs-metapac   = { version = "0.6", features = ["memory-x"] }

cortex-m         = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt      = "0.7"
defmt            = "1"
defmt-rtt        = "1"
panic-probe      = { version = "1", features = ["print-defmt"] }

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
    { target = "thumbv7m-none-eabi", artifact-dir = "out/examples/efm32gg" },
]

# The metapac that silabs-data generates locally. It exports the chip cfgs
# through `links` metadata.
[patch.crates-io]
silabs-metapac = { path = "../../../silabs-data/build/silabs-metapac" }
