[package]
name = "embassy-net-driver-channel"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "High-level channel-based driver for the `embassy-net` async TCP/IP network stack."
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-net-driver-channel"
categories = [
    "embedded",
    "no-std",
    "asynchronous",
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-net-driver-channel-v$VERSION/embassy-net-driver-channel/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-net-driver-channel/src/"
features = ["defmt"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }

embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
xarxa-driver = { git = "https://github.com/embassy-rs/xarxa", rev = "93228f1ec64720122016be52be4671e413fa92a9", features = ["async"] }

[features]
defmt = ["dep:defmt", "xarxa-driver/defmt"]
log = ["dep:log"]

## Passthroughs for the `xarxa-driver` packet pool config. The pool is a global
## singleton shared by the whole app, so enabling these anywhere affects all
## `xarxa_driver::PacketBuf`s.
##
## `packet-buf-align-4` is required by drivers that DMA directly into
## `PacketBuf::storage_mut()` (e.g. cyw43 zero-copy RX).
##
## `packet-buf-driver-headroom-64` adds 64 bytes of driver-private space to
## every buffer, so a full-size SDPCM frame fits in a buffer of the default
## `packet-buf-size-1514`.
packet-buf-align-4 = ["xarxa-driver/packet-buf-align-4"]
packet-buf-driver-headroom-64 = ["xarxa-driver/packet-buf-driver-headroom-64"]
