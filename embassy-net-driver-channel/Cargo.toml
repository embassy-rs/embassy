[package]
name = "embassy-net-driver-channel"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "High-level channel-based driver for the `embassy-net` async TCP/IP network stack."
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-net-driver-channel"
categories = [
    "embedded",
    "no-std",
    "asynchronous",
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-net-driver-channel-v$VERSION/embassy-net-driver-channel/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-net-driver-channel/src/"
features = ["defmt"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }

embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
xarxa-driver = { git = "https://github.com/embassy-rs/xarxa", rev = "af7342391a78692312cff94a826e9ea52dfea72f", features = ["async"] }

[features]
defmt = ["dep:defmt", "xarxa-driver/defmt"]
log = ["dep:log"]

# Passthrough features to configure the xarxa packet buffer pool. Drivers that
# do zero-copy DMA straight into/out of `PacketBuf` storage need these to
# guarantee sufficient size and alignment of the buffers.
packet-buf-size-1536 = ["xarxa-driver/packet-buf-size-1536"]
packet-buf-size-2048 = ["xarxa-driver/packet-buf-size-2048"]
packet-buf-align-4 = ["xarxa-driver/packet-buf-align-4"]
