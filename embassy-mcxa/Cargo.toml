    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa276"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa286"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa287"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa456"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa457"]},
