[package]
name = "embassy-mcxa"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Embassy Hardware Abstraction Layer (HAL) for NXP MCXA series of MCUs"
repository = "https://github.com/embassy-rs/embassy"
keywords = ["embedded", "hal", "nxp", "mcxa", "embassy"]
categories = ["embedded", "hardware-support", "no-std"]
documentation = "https://docs.embassy.dev/embassy-mcxa"

publish = false

[package.metadata.embassy]
build = [
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa175"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa176"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa185"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa186"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa255"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa256"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa265"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa266"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa276"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa286"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa287"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa456"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa457"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa536"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa537"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa556"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa557"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa566"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa567"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxa577"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "mcxa266", "time-driver-lptmr"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "mcxa577", "time-driver-lptmr"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-mcxa-v$VERSION/embassy-mcxa/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-mcxa/src/"

features = ["defmt", "unstable-pac"]
flavors = [
    { name = "mcx-a175", target = "thumbv8m.main-none-eabihf", features = ["mcxa175"] },
    { name = "mcx-a176", target = "thumbv8m.main-none-eabihf", features = ["mcxa176"] },
    { name = "mcx-a185", target = "thumbv8m.main-none-eabihf", features = ["mcxa185"] },
    { name = "mcx-a186", target = "thumbv8m.main-none-eabihf", features = ["mcxa186"] },
    { name = "mcx-a255", target = "thumbv8m.main-none-eabihf", features = ["mcxa255"] },
    { name = "mcx-a256", target = "thumbv8m.main-none-eabihf", features = ["mcxa256"] },
    { name = "mcx-a265", target = "thumbv8m.main-none-eabihf", features = ["mcxa265"] },
    { name = "mcx-a266", target = "thumbv8m.main-none-eabihf", features = ["mcxa266"] },
    { name = "mcx-a276", target = "thumbv8m.main-none-eabihf", features = ["mcxa276"] },
    { name = "mcx-a286", target = "thumbv8m.main-none-eabihf", features = ["mcxa286"] },
    { name = "mcx-a287", target = "thumbv8m.main-none-eabihf", features = ["mcxa287"] },
    { name = "mcx-a456", target = "thumbv8m.main-none-eabihf", features = ["mcxa456"] },
    { name = "mcx-a457", target = "thumbv8m.main-none-eabihf", features = ["mcxa457"] },
    { name = "mcx-a536", target = "thumbv8m.main-none-eabihf", features = ["mcxa536"] },
    { name = "mcx-a537", target = "thumbv8m.main-none-eabihf", features = ["mcxa537"] },
    { name = "mcx-a556", target = "thumbv8m.main-none-eabihf", features = ["mcxa556"] },
    { name = "mcx-a557", target = "thumbv8m.main-none-eabihf", features = ["mcxa557"] },
    { name = "mcx-a566", target = "thumbv8m.main-none-eabihf", features = ["mcxa566"] },
    { name = "mcx-a567", target = "thumbv8m.main-none-eabihf", features = ["mcxa567"] },
    { name = "mcx-a577", target = "thumbv8m.main-none-eabihf", features = ["mcxa577"] },
]

[dependencies]
bbqueue = { version = "0.7.0", features = ["disable-cache-padding"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core", "inline-asm"] }
# If you would like "device" to be an optional feature, please open an issue.
cortex-m-rt = { version = "0.7", features = ["device"] }
critical-section = "1.2.0"
defmt = { version = "1.0", optional = true }
embassy-embedded-hal = { version = "0.6.0", path = "../embassy-embedded-hal" }
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal", features = ["cortex-m", "prio-bits-3"] }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embedded-hal-02 = { package = "embedded-hal", version = "0.2.6", features = ["unproven"] }
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-nb = { version = "1.0" }
embedded-io = "0.7"
embedded-io-async = { version = "0.7.0" }
embedded-mcu-hal = { version = "0.3.0", optional = true }
embedded-storage = "0.3.1"
embedded-can = "0.4.1"

# Custom executor support
embassy-executor = { version = "0.10.0", path = "../embassy-executor" }

# `time` dependencies
embassy-time = { version = "0.5.1", path = "../embassy-time" }
embassy-time-driver = { version = "0.2.2", path = "../embassy-time-driver", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = { version = "0.3.2", path = "../embassy-time-queue-utils" }

grounded = { version = "0.2.1", features = ["cas", "critical-section"] }
heapless = "0.9"
maitake-sync = { version = "0.3.0", default-features = false, features = ["critical-section", "no-cache-pad"] }
nb = "1.1.0"
nxp-pac = { git = "https://github.com/embassy-rs/nxp-pac.git", rev = "a049612e781d1b616843ee49afd9839232684ff7", features = ["rt"] }
paste = "1.0.15"

rand-core-06 = { package = "rand_core", version = "0.6" }
rand-core-09 = { package = "rand_core", version = "0.9" }
rand-core-10 = { package = "rand_core", version = "0.10" }

[build-dependencies]
nxp-pac = { git = "https://github.com/embassy-rs/nxp-pac.git", rev = "a049612e781d1b616843ee49afd9839232684ff7", default-features = false, features = ["metadata"] }
proc-macro2 = "1.0.106"
quote = "1.0.45"
regex = "1.12.3"
syn = "2.0.117"
convert_case = "0.11"
indexmap = "2.14.0"

[features]
default = ["rt", "swd-swo-as-gpio", "dma-ipd-req", "time-driver-any"]

## Default to OSTIMER0 unless an explicit time driver is selected.
time-driver-any = ["rt"]
## Explicitly use OSTIMER0 as the Embassy time driver, at 1 MHz.
time-driver-ostimer = ["rt"]
## Use LPTMR0 as the Embassy time driver, at 1 MHz. Polls alarms every 1 ms.
## Overrides time-driver-any; incompatible with explicit time-driver-ostimer.
time-driver-lptmr = ["rt"]

# Base defmt feature enables core + panic handler
# Use with one logger feature: defmt-rtt (preferred) or defmt-uart (fallback)
defmt = ["dep:defmt", "nxp-pac/defmt"]

# Enable optional embedded-mcu-hal traits
embedded-mcu-hal = ["dep:embedded-mcu-hal"]

unstable-pac = []

# Allows for using SOSC pins as normal GPIOs.
#
# DISABLING this allows for use of SOSC, but reserves the GPIO pins required.
# ENABLING this means SOSC cannot be set/configured, but makes the GPIO pins available
sosc-as-gpio = []

# Allows for using the ROSC (32k external clock) pins as normal GPIOs.
#
# DISABLING this allows for use of the 32k clock, but reserves the GPIO pins required.
# ENABLING this means the 32k clock cannot be set/configured, but makes the GPIO pins available
#
# NOTE: Only applicable to MCXA5xx.
rosc-32k-as-gpio = []

# Allows for using SWDIO and SWCLK pins as normal GPIOs.
#
# WARNING: This WILL cause problems if you plan to use defmt over RTT,
# or otherwise debug the system while running.
#
# If this feature is enabled, the relevant pin(s) will be set to floating inputs
# in the HAL init function.
#
# This does NOT include the SWO pin.
swd-as-gpio = []

# Allows for using the SWD SWO pins as a normal GPIO. This is not used for
# basic probe-rs/rtt usage, but is sometimes used with ITM.
#
# If this feature is enabled, the relevant pin(s) will be set to floating inputs
# in the HAL init function.
swd-swo-as-gpio = []

# Allows for using the extra JTAG pins (TDI, ISPMODE_N) as normal GPIOs. You
# must also select `swd-as-gpio`, `swd-swo-as-gpio`, and MAYBE `dangerous-reset-as-gpio`
# to recover all JTAG pins. These are called "extras" because they aren't also used
# for normal SWD/SWO.
jtag-extras-as-gpio = []

# Allows for using the reset pin as a normal GPIO.
#
# This is NOT recommended, and we have not currently tested whether it remains
# possible to reset the device and reflash using probe-rs after enabling this
# feature. Use at your own risk!
dangerous-reset-as-gpio = []

# Unmasks DMA IPD_REQ hardware lines in AHBSC during init. (only on MCXA5xx)
#
# If this feature is not set, something else is responsible for unmasking them
# when driving DMA transfers from hardware peripheral requests.
# This can either be another (trustzone secure) binary or from IFR0 CFPA Trustzone presets.
dma-ipd-req = []

# dummy feature to silence embassy-hal-internal lint
#
# This feature makes no change to embassy-mcxa's operation.
rt = []

# Enable perf counters
perf = []

# Enable irq tracing
trace = []

# Enable the custom executor platform implementation, which allows for low-power modes.
#
# If this feature is enabled, users should NOT enable `embassy-executor/platform-cortex-m` or any other executor platform.
executor-platform = []

# This feature is not done yet, don't use it!
unstable-osc32k = []

#
# Chip selection
#
mcxa175 = ["_mcxa2xx", "nxp-pac/mcxa175"]
mcxa176 = ["_mcxa2xx", "nxp-pac/mcxa176"]
mcxa185 = ["_mcxa2xx", "nxp-pac/mcxa185"]
mcxa186 = ["_mcxa2xx", "nxp-pac/mcxa186"]
mcxa255 = ["_mcxa2xx", "nxp-pac/mcxa255"]
mcxa256 = ["_mcxa2xx", "nxp-pac/mcxa256"]
mcxa265 = ["_mcxa2xx", "nxp-pac/mcxa265"]
mcxa266 = ["_mcxa2xx", "nxp-pac/mcxa266"]
mcxa276 = ["_mcxa2xx", "nxp-pac/mcxa276"]
mcxa286 = ["_mcxa5xx", "nxp-pac/mcxa286"]
mcxa287 = ["_mcxa5xx", "nxp-pac/mcxa287"]
mcxa456 = ["_mcxa5xx", "nxp-pac/mcxa456"]
mcxa457 = ["_mcxa5xx", "nxp-pac/mcxa457"]
mcxa536 = ["_mcxa5xx", "nxp-pac/mcxa536"]
mcxa537 = ["_mcxa5xx", "nxp-pac/mcxa537"]
mcxa556 = ["_mcxa5xx", "nxp-pac/mcxa556"]
mcxa557 = ["_mcxa5xx", "nxp-pac/mcxa557"]
mcxa566 = ["_mcxa5xx", "nxp-pac/mcxa566"]
mcxa567 = ["_mcxa5xx", "nxp-pac/mcxa567"]
mcxa577 = ["_mcxa5xx", "nxp-pac/mcxa577"]

# Compatibility aliases.
mcxa2xx = ["mcxa266"]
mcxa5xx = ["mcxa577"]

_mcxa2xx = []
_mcxa5xx = []

[dev-dependencies]
embassy-executor = { version = "0.10.0", path = "../embassy-executor", features = ["platform-cortex-m", "executor-interrupt", "executor-thread"] }
embedded-storage = "0.3.1"
panic-halt = "1.0.0"
static_cell = "2.1.1"
