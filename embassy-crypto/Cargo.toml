[package]
name = "embassy-crypto"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Driver trait for `embassy-crypto`."
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-crypto"
categories = [
    "embedded",
    "no-std",
    "asynchronous",
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-crypto-driver-v$VERSION/embassy-net-driver/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-crypto-driver/src/"
features = ["defmt", "driver-rustcrypto"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt", "driver-rustcrypto"]

[package.metadata.embassy]
build = [
    {target = "thumbv7em-none-eabi", features = ["defmt", "driver-rustcrypto"]},
]

[dependencies]
signature = { version = "3", default-features = false, features = ["digest"] }
embassy-crypto-driver = { path = "../embassy-crypto-driver" }
digest = { version = "0.11", default-features = false, features = ["mac"] }
crypto-common = "0.2"
cipher = { version = "0.5", default-features = false }
aead = { version = "0.6", default-features = false }
generic-array = "1.4.5"
heapless = "0.8"

# RustCrypto software-driver dependencies (all optional)
md-5 = { version = "0.11", default-features = false, optional = true }
sha1 = { version = "0.11", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
hmac = { version = "0.13", default-features = false, optional = true }
aes = { version = "0.9", default-features = false, optional = true }
aes-gcm = { version = "0.11", default-features = false, features = ["aes"], optional = true }
ccm = { version = "0.6", default-features = false, optional = true }
ctr = { version = "0.10", default-features = false, optional = true }
cbc = { version = "0.2", default-features = false, optional = true }
cmac = { version = "0.8", default-features = false, optional = true }

[features]
defmt = ["embassy-crypto-driver/defmt"]

## Use RustCrypto crates as a software fallback driver.
driver-rustcrypto = [
    "driver-md5",
    "driver-sha1",
    "driver-sha2",
    "driver-hmac-sha1",
    "driver-hmac-sha2",
    "driver-aes128",
    "driver-aes256",
    "driver-aes128cbc",
    "driver-aes256cbc",
    "driver-aes128ctr",
    "driver-aes256ctr",
    "driver-aes128gcm",
    "driver-aes256gcm",
    "driver-aes128ccm",
    "driver-aes256ccm",
    "driver-aes128cmac",
    "driver-aes256cmac",
]

driver-md5 = ["dep:md-5"]
driver-sha1 = ["dep:sha1"]
driver-sha2 = ["dep:sha2"]
driver-hmac-sha1 = ["dep:hmac", "dep:sha1"]
driver-hmac-sha2 = ["dep:hmac", "dep:sha2"]
driver-aes128 = ["dep:aes"]
driver-aes256 = ["dep:aes"]
driver-aes128cbc = ["dep:aes", "dep:cbc"]
driver-aes256cbc = ["dep:aes", "dep:cbc"]
driver-aes128ctr = ["dep:aes", "dep:ctr"]
driver-aes256ctr = ["dep:aes", "dep:ctr"]
driver-aes128gcm = ["dep:aes-gcm"]
driver-aes256gcm = ["dep:aes-gcm"]
driver-aes128ccm = ["dep:ccm", "dep:aes"]
driver-aes256ccm = ["dep:ccm", "dep:aes"]
driver-aes128cmac = ["dep:cmac", "dep:aes"]
driver-aes256cmac = ["dep:cmac", "dep:aes"]
