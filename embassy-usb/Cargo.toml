[package]
name = "embassy-usb"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Async USB device and host stack for embedded devices in Rust."
keywords = ["embedded", "async", "usb", "hal", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-usb"

[package.metadata.embassy]
build = [
    {target = "thumbv6m-none-eabi", features = []},
    {target = "thumbv6m-none-eabi", features = ["log"]},
    {target = "thumbv6m-none-eabi", features = ["defmt"]},
    {target = "thumbv6m-none-eabi", features = ["max-interface-count-1"]},
    {target = "thumbv6m-none-eabi", features = ["max-interface-count-8"]},
    {target = "thumbv6m-none-eabi", features = ["max-handler-count-8"]},
    {target = "thumbv6m-none-eabi", features = ["block-device-driver"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-usb-v$VERSION/embassy-usb/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-usb/src/"
features = ["defmt", "block-device-driver"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt", "block-device-driver"]

[features]
default = ["device", "host", "class-all"]

# Roles. `device` and `host` are independent; a class feature only compiles the
# submodules for the roles that are enabled.
device = []
host = ["dep:embassy-time"]

# Mock host allocator/pipes and golden descriptors for downstream class tests.
test-utils = ["host"]

# All classes, for backwards compatibility. Users that want a minimal build can
# disable default features and enable only the classes they need.
class-all = [
    "class-bth",
    "class-ccid",
    "class-cdc-acm",
    "class-cdc-ncm",
    "class-cmsis-dap-v2",
    "class-dfu",
    "class-gip",
    "class-gud",
    "class-hid",
    "class-hub",
    "class-midi",
    "class-msc",
    "class-uac",
    "class-usbtmc",
    "class-uvc",
    "class-vcp",
    "class-vendor",
    "class-web-usb",
]

# Classes supporting both device and host.
class-ccid = []
class-cdc-acm = ["embedded-io"]
class-hid = []
class-midi = []
class-msc = []
class-uac = []

# Device-only classes.
class-bth = ["device"]
class-cdc-ncm = ["device", "dep:embassy-net-driver-channel"]
class-cmsis-dap-v2 = ["device"]
class-dfu = ["device", "dep:embassy-time"]
class-gud = ["device"]
class-usbtmc = ["device"]
class-uvc = ["device"]
class-vendor = ["device", "embedded-io"]
class-web-usb = ["device"]

# Host-only classes.
class-gip = ["host"]
class-hub = ["host"]
class-vcp = ["host", "class-cdc-acm"]

# Enables the `embedded-io-async` trait implementations and the shared
# `ClassError` mapping. Pulled in by the classes that use it.
embedded-io = ["dep:embedded-io-async"]

defmt = ["dep:defmt", "embassy-usb-driver/defmt", "heapless/defmt"]
log = ["dep:log"]
block-device-driver = ["dep:block-device-driver"]

# BEGIN AUTOGENERATED CONFIG FEATURES
# Generated by gen_config.py. DO NOT EDIT.
max-interface-count-1 = []
max-interface-count-2 = []
max-interface-count-3 = []
max-interface-count-4 = [] # Default
max-interface-count-5 = []
max-interface-count-6 = []
max-interface-count-7 = []
max-interface-count-8 = []

max-handler-count-1 = []
max-handler-count-2 = []
max-handler-count-3 = []
max-handler-count-4 = [] # Default
max-handler-count-5 = []
max-handler-count-6 = []
max-handler-count-7 = []
max-handler-count-8 = []

# END AUTOGENERATED CONFIG FEATURES

[dependencies]
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
embassy-usb-driver = { version = "0.2.2", path = "../embassy-usb-driver" }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-net-driver-channel = { version = "0.4.0", path = "../embassy-net-driver-channel", optional = true }
embassy-time = { version = "0.5.1", path = "../embassy-time", optional = true }

defmt = { version = "1", optional = true }
log = { version = "0.4.14", optional = true }
heapless = "0.9"
embedded-io-async = { version = "0.7.0", optional = true }
bitflags = "2.4.1"
aligned = "0.4"

# for Host
block-device-driver = { version = "0.2.0", optional = true }

[target.'cfg(not(target_has_atomic = "32"))'.dependencies]
portable-atomic = "1.5"

[dev-dependencies]
env_logger = "0.11"
critical-section = { version = "1.1", features = ["std"] }
embassy-time = { version = "0.5.1", path = "../embassy-time", features = ["mock-driver", "generic-queue-8"] }
