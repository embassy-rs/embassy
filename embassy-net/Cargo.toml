[package]
name = "embassy-net"
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Async TCP/IP network stack for embedded systems"
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-net"
categories = [
    "embedded",
    "no-std",
    "asynchronous",
    "network-programming",
]

[package.metadata.embassy]
build = [
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "packet-log", "ipv4", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "multicast", "ipv4", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dhcpv4", "dns", "medium-ethernet", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dhcpv4", "dhcpv4-options", "dns", "medium-ethernet", "hostname", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dhcpv4", "dhcpv4-options", "dns", "medium-ethernet", "slaac", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dhcpv4-server", "dns", "medium-ethernet", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "ipv6", "slaac", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ieee802154", "ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "medium-ieee802154", "ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "ipv4", "ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ip", "ipv4", "ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "medium-ieee802154", "medium-ip", "ipv4", "ipv6", "tcp", "tcp-listener", "udp", "raw-ethernet", "raw-ip", "iface-bind", "embedded-nal"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "medium-ieee802154", "medium-ip", "ipv4", "ipv6", "tcp", "udp", "packetmeta-id", "packetmeta-timestamp"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-net-v$VERSION/embassy-net/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-net/src/"
features = ["defmt", "tcp", "tcp-listener", "udp", "raw-ethernet", "raw-ip", "iface-bind", "hostname", "dns", "dhcpv4", "dhcpv4-options", "dhcpv4-server", "ipv4", "ipv6", "medium-ethernet", "medium-ip", "medium-ieee802154", "multicast", "slaac", "packetmeta-id", "packetmeta-timestamp", "embedded-nal"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt", "tcp", "tcp-listener", "udp", "raw-ethernet", "raw-ip", "iface-bind", "hostname", "dns", "dhcpv4", "dhcpv4-options", "dhcpv4-server", "ipv4", "ipv6", "medium-ethernet", "medium-ip", "medium-ieee802154", "multicast", "slaac", "packetmeta-id", "packetmeta-timestamp", "embedded-nal"]

[features]
## Enable APIs that use the heap.
alloc = ["xarxa/alloc"]

#! ### Protocol support
## Support interfaces that send and receive Ethernet frames, with the link-layer
## machinery that goes with them (ARP, NDISC, the neighbor cache).
medium-ethernet = ["xarxa/medium-ethernet"]
## Support interfaces that send and receive bare IP packets, without a link-layer
## header.
medium-ip = ["xarxa/medium-ip"]
## Support IEEE 802.15.4 interfaces carrying 6LoWPAN (RFC 4944, RFC 6282). Needs `ipv6`.
medium-ieee802154 = ["ipv6", "xarxa/medium-ieee802154"]
## Fragment outgoing 6LoWPAN packets larger than one 802.15.4 frame. Needs `medium-ieee802154`.
sixlowpan-fragmentation = ["medium-ieee802154", "xarxa/sixlowpan-fragmentation"]
## Reassemble incoming 6LoWPAN fragments. Needs `medium-ieee802154`.
sixlowpan-reassembly = ["medium-ieee802154", "xarxa/sixlowpan-reassembly"]
## Support IPv4 (and, with `medium-ethernet`, ARP).
ipv4 = ["xarxa/ipv4"]
## Fragment outgoing IPv4 packets larger than the interface MTU. Needs `ipv4`.
ipv4-fragmentation = ["ipv4", "xarxa/ipv4-fragmentation"]
## Reassemble incoming IPv4 fragments. Needs `ipv4`.
ipv4-reassembly = ["ipv4", "xarxa/ipv4-reassembly"]
## Support IPv6 (and, with `medium-ethernet`, NDISC).
ipv6 = ["xarxa/ipv6"]
# Raw socket machinery shared by both modes. Private, do not enable directly.
_raw = []
## Ethernet-mode raw sockets: send and receive whole Ethernet frames. Needs `medium-ethernet`.
raw-ethernet = ["_raw", "medium-ethernet", "xarxa/raw-ethernet"]
## IP-mode raw sockets: send and receive whole IP packets.
raw-ip = ["_raw", "xarxa/raw-ip"]
## UDP sockets.
udp = ["xarxa/udp"]
## TCP sockets.
tcp = ["xarxa/tcp"]
## TCP listeners, for accepting incoming connections.
tcp-listener = ["tcp", "xarxa/tcp-listener"]
## DHCPv4 client, built into the interface. Needs `ipv4` and `medium-ethernet`.
dhcpv4 = ["ipv4", "medium-ethernet", "xarxa/dhcpv4"]
## Allow reading received DHCP options.
dhcpv4-options = ["dhcpv4", "xarxa/dhcpv4-options"]
## DHCPv4 server, built into the interface. Needs `ipv4` and `medium-ethernet`.
dhcpv4-server = ["ipv4", "medium-ethernet", "xarxa/dhcpv4-server"]
## Give the stack a hostname, with `Stack::set_hostname`. If set, it is sent
## to the DHCP server in outgoing DHCP messages.
hostname = ["xarxa/hostname"]
## IPv6 stateless address autoconfiguration (SLAAC). Needs `ipv6`, and
## `medium-ethernet` or `medium-ieee802154`.
slaac = ["ipv6", "xarxa/slaac"]
## DNS client.
dns = ["udp", "xarxa/dns"]
## Implement the `embedded-nal-async` traits, with `tcp::client::TcpClient` and `dns::DnsClient`.
embedded-nal = ["dep:embedded-nal-async"]
## Resolve `.local` names with multicast DNS in the DNS client.
mdns = ["dns", "xarxa/mdns"]
## Join IP multicast groups, with IGMP (IPv4) and MLD (IPv6) membership reports.
multicast = ["xarxa/multicast"]
## Send and receive the TCP timestamp option (RFC 7323).
tcp-timestamps = ["tcp", "xarxa/tcp-timestamps"]
## Send selective acknowledgement ranges (RFC 2018).
tcp-sack = ["tcp", "xarxa/tcp-sack"]
## Automatically reply to pings (ICMP echo requests).
icmp-ping-reply = ["xarxa/icmp-ping-reply"]
## Bind sockets to an interface with `bind_to_iface`. A bound socket only
## receives packets that arrive on that interface, and only sends out of it.
iface-bind = ["xarxa/iface-bind"]
## Deliver incoming ICMP error messages (destination unreachable, packet too big, ...) to
## the sockets that provoked them.
icmp-errors = ["xarxa/icmp-errors"]

#! ### TCP congestion control
#! Enable one of these features to enable congestion control. No feature enabled means
#! no congestion control. You may enable at most one.
## Use the Reno congestion control algorithm on TCP sockets.
tcp-reno = ["tcp", "xarxa/tcp-reno"]
## Use the CUBIC congestion control algorithm on TCP sockets. Warning: it uses `f64` arithmetic which can be slow and pull in soft-float code depending on the target.
tcp-cubic = ["tcp", "xarxa/tcp-cubic"]

#! ### Packet metadata
## Enable the `PacketMeta::id` field: an opaque number that travels with a packet
## through the whole stack.
packetmeta-id = ["xarxa/packetmeta-id"]
## Enable the `PacketMeta::timestamp` and `PacketMeta::request_timestamp` fields, and
## `Driver::poll_tx_timestamp`.
packetmeta-timestamp = ["packetmeta-id", "xarxa/packetmeta-timestamp"]

#! ### Logging
## Log with the `log` crate.
log = ["dep:log", "xarxa/log"]
## Log with the `defmt` crate.
defmt = ["dep:defmt", "xarxa/defmt", "embassy-time/defmt", "heapless/defmt", "defmt?/ip_in_core"]
## Log every packet received and sent, decoded.
## Needs `log` or `defmt` to print anything.
packet-log = ["xarxa/packet-log"]

[dependencies]

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }

xarxa = { git = "https://github.com/embassy-rs/xarxa", rev = "14c369bbcbe8ee7167488ac9c9e18be059d83555", default-features = false, features = ["async"] }
xarxa-driver = { git = "https://github.com/embassy-rs/xarxa", rev = "14c369bbcbe8ee7167488ac9c9e18be059d83555", default-features = false, features = ["async"] }
embassy-time = { version = "0.5.1", path = "../embassy-time" }
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embedded-io-async = { version = "0.7.0" }

heapless = { version = "0.9", default-features = false }
embedded-nal-async = { version = "0.9.0", optional = true }
document-features = "0.2.12"
