[package]
name = "embassy-mcxa5xx-hil"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
teleprobe-meta = "1.1"

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["set-sp", "set-vtor"] }
critical-section = "1.2.0"
defmt = "1.0"
defmt-rtt = "1.0"

embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-interrupt", "executor-thread"], default-features = false }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embassy-mcxa = { version = "0.1.0", path = "../../embassy-mcxa", features = ["defmt", "unstable-pac", "mcxa5xx"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }

panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[features]
default = []
max-frame-baseline = []

[profile.dev]
debug = 2
debug-assertions = true
opt-level = "s"
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
incremental = false
opt-level = 0
overflow-checks = false

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/tests/frdm-mcx-a577" }
]
