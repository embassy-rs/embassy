[package]
edition = "2024"
name = "embassy-nrf-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
teleprobe-meta = "1"

embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embassy-sync = { version = "0.8.0", path = "../../embassy-sync", features = ["defmt", ] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt",  "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11.0", path = "../../embassy-nrf", features = ["defmt", "gpiote", "unstable-pac"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", path = "../../embassy-net", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet", ] }
embassy-net-esp-hosted = { version = "0.3.0", path = "../../embassy-net-esp-hosted", features = ["defmt", "esp-hosted-fg"] }
embassy-net-enc28j60 = { version = "0.3.0", path = "../../embassy-net-enc28j60", features = ["defmt"] }
# Shrink the packet pool: the tests link everything into RAM, and the default 16 buffers don't fit.
xarxa-driver = { git = "https://github.com/embassy-rs/xarxa", rev = "3e4cae1cc576d375d52513822cdcb4a6a0f6e382", features = ["packet-buf-count-8"] }
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.1", features = ["async"] }
static_cell = "2"
perf-client = { path = "../perf-client" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
portable-atomic = { version = "1.6.0" }
embassy-crypto = { version = "0.1.0", path = "../../embassy-crypto", features = ["defmt"] }
embassy-crypto-test = { version = "0.1.0", path = "../../embassy-crypto-test", features = ["defmt"] }

[features]
nrf51422 = ["embassy-nrf/nrf51",         "embassy-nrf/time-driver-rtc1", "portable-atomic/unsafe-assume-single-core"]
nrf52832 = ["embassy-nrf/nrf52832",      "embassy-nrf/time-driver-rtc1", "easydma"]
nrf52833 = ["embassy-nrf/nrf52833",      "embassy-nrf/time-driver-rtc1", "easydma", "two-uarts"]
nrf52840 = ["embassy-nrf/nrf52840",      "embassy-nrf/time-driver-rtc1", "easydma", "two-uarts"]
nrf5340  = ["embassy-nrf/nrf5340-app-s", "embassy-nrf/time-driver-rtc1", "easydma", "two-uarts", "aes256"]
nrf9160  = ["embassy-nrf/nrf9160-s",     "embassy-nrf/time-driver-rtc1", "easydma", "two-uarts"]
nrf54l15 = ["embassy-nrf/nrf54l15-app-s", "embassy-nrf/time-driver-grtc", "easydma", "two-uarts", "aes256", "sha512", "cracen"]

easydma = []
two-uarts = []

# The crypto tests come in two groups that cannot be built together: the `embassy-crypto-*`
# features of embassy-nrf remove the peripheral singletons the direct-API tests need. So the
# chip features enable neither; the build entries below build the crate once with `crypto` (the
# direct API) and once with `embassy-crypto` (the `embassy-crypto` drivers), into the same
# directory.

# The direct-API crypto tests.
crypto = []
# The accelerator has AES-256 and AES-GCM, which the CryptoCell only has in its 312 version.
aes256 = []
# The accelerator has the SHA-512 family.
sha512 = []
# The accelerator is CRACEN rather than a CryptoCell.
cracen = []

# The `embassy-crypto` crypto tests. `embassy-crypto-rng` is left out: embassy-crypto-test
# registers a random number driver of its own.
embassy-crypto = [
    "embassy-nrf/embassy-crypto-sha1",
    "embassy-nrf/embassy-crypto-sha224",
    "embassy-nrf/embassy-crypto-sha256",
    "embassy-nrf/embassy-crypto-hmac-sha1",
    "embassy-nrf/embassy-crypto-hmac-sha224",
    "embassy-nrf/embassy-crypto-hmac-sha256",
    "embassy-nrf/embassy-crypto-aes128-ecb",
    "embassy-nrf/embassy-crypto-aes128-cbc",
    "embassy-nrf/embassy-crypto-aes128-ctr",
    "embassy-nrf/embassy-crypto-aes128-cmac",
    "embassy-nrf/embassy-crypto-aes128-ccm",
    "embassy-nrf/embassy-crypto-aes128-gcm",
    "embassy-nrf/embassy-crypto-chacha8",
    "embassy-nrf/embassy-crypto-chacha12",
    "embassy-nrf/embassy-crypto-chacha20",
    "embassy-nrf/embassy-crypto-chacha8-poly1305",
    "embassy-nrf/embassy-crypto-chacha12-poly1305",
    "embassy-nrf/embassy-crypto-chacha20-poly1305",
    "embassy-nrf/embassy-crypto-p256-arith",
    "embassy-nrf/embassy-crypto-p256-ecdh",
    "embassy-nrf/embassy-crypto-p256-ecdsa",
    "embassy-nrf/embassy-crypto-p384-arith",
    "embassy-nrf/embassy-crypto-p384-ecdh",
    "embassy-nrf/embassy-crypto-p384-ecdsa",
]
embassy-crypto-aes256 = [
    "embassy-crypto",
    "embassy-nrf/embassy-crypto-aes256-ecb",
    "embassy-nrf/embassy-crypto-aes256-cbc",
    "embassy-nrf/embassy-crypto-aes256-ctr",
    "embassy-nrf/embassy-crypto-aes256-cmac",
    "embassy-nrf/embassy-crypto-aes256-ccm",
    "embassy-nrf/embassy-crypto-aes256-gcm",
]
embassy-crypto-sha512 = [
    "embassy-crypto",
    "embassy-nrf/embassy-crypto-sha384",
    "embassy-nrf/embassy-crypto-sha512",
    "embassy-nrf/embassy-crypto-sha512-224",
    "embassy-nrf/embassy-crypto-sha512-256",
    "embassy-nrf/embassy-crypto-hmac-sha384",
    "embassy-nrf/embassy-crypto-hmac-sha512",
    "embassy-nrf/embassy-crypto-hmac-sha512-224",
    "embassy-nrf/embassy-crypto-hmac-sha512-256",
]

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 's'
overflow-checks = false

