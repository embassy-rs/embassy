[package]
name = "perf-client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-net = { version = "0.9.1", path = "../../embassy-net", features = ["defmt", "tcp", "dhcpv4"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", ] }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
defmt = "1.0.1"

embedded-tls = { version = "0.19", optional = true, default-features = false, features = ["defmt"] }
embassy-crypto = { version = "0.1.0", path = "../../embassy-crypto", optional = true, default-features = false, features = ["defmt"] }
static_cell = { version = "2.0", optional = true }

[features]
tls = ["dep:embedded-tls", "dep:embassy-crypto", "dep:static_cell"]
