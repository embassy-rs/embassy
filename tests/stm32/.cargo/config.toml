[unstable]
#build-std = ["core"]
#build-std-features = ["panic_immediate_abort"]

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "teleprobe client run -s"
#runner = "teleprobe local run --chip STM32H7S3L8Hx --elf"

rustflags = [
  # Code-size optimizations.
  #"-Z", "trap-unreachable=no",
  "-C", "no-vectorize-loops",
]

# Cortex-M33 targets: enable the DSP extension so assembly crypto backends
# gated on UMAAL (`+dsp`) are selected (e.g. mcu-crypto-asm's P-256).
[target.thumbv8m.main-none-eabihf]
rustflags = ["-C", "target-feature=+dsp"]

[build]
#target = "thumbv6m-none-eabi"
#target = "thumbv7m-none-eabi"
target = "thumbv7em-none-eabi"
#target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "trace,embassy_hal_internal=debug,embassy_net_esp_hosted=debug,xarxa=info,embedded-tls=info"
