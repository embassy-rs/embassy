[package]
name = "embassy-stm32-wpan"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Async STM32 WPAN stack for embedded devices in Rust."
keywords = ["embedded", "async", "stm32", "ble", "wpan"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-stm32-wpan"

publish = false

[package.metadata.embassy]
build = [
    {target = "thumbv7em-none-eabi", features = ["stm32wb55rg"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-stm32-wpan-v$VERSION/embassy-stm32-wpan/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-stm32-wpan/src/"
target = "thumbv7em-none-eabihf"
features = ["stm32wb55rg", "wb-ble", "wb-mac"]

[package.metadata.docs.rs]
features = ["stm32wb55rg", "wb-ble", "wb-mac"]

[dependencies]
embassy-stm32 = { version = "0.6.0", path = "../embassy-stm32" , features = ["unstable-pac"]}
embassy-crypto = { version = "0.1.0", path = "../embassy-crypto" }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-time = { version = "0.5.1", path = "../embassy-time" }
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal" }
embassy-embedded-hal = { version = "0.6.0", path = "../embassy-embedded-hal" }
embassy-net-driver-channel = { version = "0.4.0", path = "../embassy-net-driver-channel", optional=true}
stm32-bindings = { version = "0.3.1", optional=true, default-features = false }

xarxa = { git = "https://github.com/embassy-rs/xarxa", rev = "93228f1ec64720122016be52be4671e413fa92a9", optional = true, default-features = false }

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.17", optional = true }

cortex-m = "0.7.6"
heapless = { version = "0.9", features = ["defmt"] }
aligned = "0.4.3"
critical-section = "1.2"

bit_field = "0.10.2"
stm32-device-signature = { version = "0.3.3", features = ["stm32wb5x"] }
stm32wb-hci = { version = "0.20.0", default-features = false, optional = true }
futures-util = { version = "0.3.30", default-features = false }
bitflags = { version = "2.3.3", optional = true }
bt-hci = { version = "0.11.0", optional = true }
embedded-io = { version = "0.7.1" }
futures-intrusive = { version ="0.5.0", default-features = false }

[features]
defmt = ["dep:defmt", "embassy-sync/defmt", "embassy-embedded-hal/defmt", "embassy-hal-internal/defmt", "embassy-crypto/defmt", "stm32wb-hci?/defmt", "bt-hci?/defmt", "embedded-io/defmt"]
log = ["dep:log"]
bt-hci = ["dep:bt-hci"]
wb-hci = ["bt-hci", "dep:stm32wb-hci"]


wb = []
wb-ble = []
wb-mac = ["dep:bitflags", "dep:embassy-net-driver-channel", "dep:xarxa", "xarxa/medium-ieee802154"]
wb-thread = ["dep:stm32-bindings", "stm32-bindings/wb_wpan_openthread"]

# STM32WB wireless binary running on CPU2, used with `wb-hci` (choose one release
# and one stack). `stm32wb-hci` only provides the HCI commands and events that
# binary implements. The BLE + Thread/Zigbee/MAC combo binaries carry the full
# BLE stack: select `wb-stack-full` for them.
wb-fw-1-15-0 = [ "stm32wb-hci?/fw_1_15_0" ]
wb-fw-1-16-0 = [ "stm32wb-hci?/fw_1_16_0" ]
wb-fw-1-17-0 = [ "stm32wb-hci?/fw_1_17_0" ]
wb-fw-1-17-1 = [ "stm32wb-hci?/fw_1_17_1" ]
wb-fw-1-17-2 = [ "stm32wb-hci?/fw_1_17_2" ]
wb-fw-1-17-3 = [ "stm32wb-hci?/fw_1_17_3" ]
wb-fw-1-18-0 = [ "stm32wb-hci?/fw_1_18_0" ]
wb-fw-1-19-0 = [ "stm32wb-hci?/fw_1_19_0" ]
wb-fw-1-19-1 = [ "stm32wb-hci?/fw_1_19_1" ]
wb-fw-1-20-0 = [ "stm32wb-hci?/fw_1_20_0" ]
wb-fw-1-21-0 = [ "stm32wb-hci?/fw_1_21_0" ]
wb-fw-1-22-0 = [ "stm32wb-hci?/fw_1_22_0" ]
wb-fw-1-22-1 = [ "stm32wb-hci?/fw_1_22_1" ]
wb-fw-1-23-0 = [ "stm32wb-hci?/fw_1_23_0" ]
wb-fw-1-24-0 = [ "stm32wb-hci?/fw_1_24_0" ]

wb-stack-full-extended = [ "stm32wb-hci?/stack-full-extended" ]
wb-stack-full = [ "stm32wb-hci?/stack-full" ]
wb-stack-light = [ "stm32wb-hci?/stack-light" ]
wb-stack-hci-layer-extended = [ "stm32wb-hci?/stack-hci-layer-extended" ]
wb-stack-hci-layer = [ "stm32wb-hci?/stack-hci-layer" ]
wb-stack-hci-adv-scan = [ "stm32wb-hci?/stack-hci-adv-scan" ]

wba = [ "dep:stm32-bindings", "stm32wb-hci?/wba_1_10_0" ]
wba-ble = [ "stm32-bindings/wba_wpan_ble" , "stm32-bindings/wba_wpan", "stm32-bindings/wba_wpan_mac" ]
wba-mac = [ "stm32-bindings/wba_wpan_mac", "stm32-bindings/wba_wpan_ble" , "stm32-bindings/lib_linklayer_802_15_4_v3_0", "stm32-bindings/lib_wba_mac_lib" , "stm32-bindings/wba_wpan" ]

# BLE stack library variants (choose one). CubeWBA 1.10.0 ships only the full
# host stack and the link-layer-only (`llo`) variant; the old basic/basic_plus/po
# host stacks are gone and the controller feature set is selected by the
# `linklayer-ble-*` archive instead.
#
# Each variant also selects its `stm32wb-hci` stack profile, so that only the
# HCI commands and events of that configuration are available. The release is
# STM32CubeWBA 1.10.0 (`wba_1_10_0`, selected by `wba`), the one the bindings are
# generated from.
ble-stack-basic = [ "stm32-bindings/lib_stm32wba_ble_stack_full", "stm32wb-hci?/stack-wba-basic-features" ]
ble-stack-basic-plus = [ "stm32-bindings/lib_stm32wba_ble_stack_full", "stm32wb-hci?/stack-wba-basic-plus" ]
ble-stack-full = [ "stm32-bindings/lib_stm32wba_ble_stack_full", "stm32wb-hci?/stack-wba-full" ]
ble-stack-po = [ "stm32-bindings/lib_stm32wba_ble_stack_full", "stm32wb-hci?/stack-wba-peripheral-only" ]
ble-stack-llo = [ "stm32-bindings/lib_stm32wba_ble_stack_llo", "stm32wb-hci?/stack-wba-link-layer-only" ]

# Link layer library variants. 1.10.0 unified the WBA5/WBA6 link layer into the
# `_v3_0` archives (`_v3_0p` is the WBA25 variant).
linklayer-ble-basic = [ "stm32-bindings/lib_linklayer_ble_basic_v3_0" ]
linklayer-ble-basic-plus = [ "stm32-bindings/lib_linklayer_ble_basic_plus_v3_0" ]
linklayer-ble-full = [ "stm32-bindings/lib_linklayer_ble_full_v3_0" ]
linklayer-ble-peripheral-only = [ "stm32-bindings/lib_linklayer_ble_peripheral_only_v3_0" ]

# WBA6 shares the (unified) WBA5 link layer archives in 1.10.0.
linklayer6-ble-basic = [ "stm32-bindings/lib_linklayer_ble_basic_v3_0" ]
linklayer6-ble-basic-plus = [ "stm32-bindings/lib_linklayer_ble_basic_plus_v3_0" ]
linklayer6-ble-full = [ "stm32-bindings/lib_linklayer_ble_full_v3_0" ]
linklayer6-ble-peripheral-only = [ "stm32-bindings/lib_linklayer_ble_peripheral_only_v3_0" ]

extended = []

stm32wb10cc = [ "embassy-stm32/stm32wb10cc" , "wb" ]
stm32wb15cc = [ "embassy-stm32/stm32wb15cc" , "wb" ]
stm32wb30ce = [ "embassy-stm32/stm32wb30ce" , "wb" ]
stm32wb35cc = [ "embassy-stm32/stm32wb35cc" , "wb" ]
stm32wb35ce = [ "embassy-stm32/stm32wb35ce" , "wb" ]
stm32wb50cg = [ "embassy-stm32/stm32wb50cg" , "wb" ]
stm32wb55cc = [ "embassy-stm32/stm32wb55cc" , "wb" ]
stm32wb55ce = [ "embassy-stm32/stm32wb55ce" , "wb" ]
stm32wb55cg = [ "embassy-stm32/stm32wb55cg" , "wb" ]
stm32wb55rc = [ "embassy-stm32/stm32wb55rc" , "wb" ]
stm32wb55re = [ "embassy-stm32/stm32wb55re" , "wb" ]
stm32wb55rg = [ "embassy-stm32/stm32wb55rg" , "wb" ]
stm32wb55vc = [ "embassy-stm32/stm32wb55vc" , "wb" ]
stm32wb55ve = [ "embassy-stm32/stm32wb55ve" , "wb" ]
stm32wb55vg = [ "embassy-stm32/stm32wb55vg" , "wb" ]
stm32wb55vy = [ "embassy-stm32/stm32wb55vy" , "wb" ]
stm32wba50ke = [ "embassy-stm32/stm32wba50ke", "wba" ]
stm32wba50kg = [ "embassy-stm32/stm32wba50kg", "wba" ]
stm32wba52ce = [ "embassy-stm32/stm32wba52ce", "wba" ]
stm32wba52cg = [ "embassy-stm32/stm32wba52cg", "wba" ]
stm32wba52ke = [ "embassy-stm32/stm32wba52ke", "wba" ]
stm32wba52kg = [ "embassy-stm32/stm32wba52kg", "wba" ]
stm32wba54ce = [ "embassy-stm32/stm32wba54ce", "wba" ]
stm32wba54cg = [ "embassy-stm32/stm32wba54cg", "wba" ]
stm32wba54ke = [ "embassy-stm32/stm32wba54ke", "wba" ]
stm32wba54kg = [ "embassy-stm32/stm32wba54kg", "wba" ]
stm32wba55ce = [ "embassy-stm32/stm32wba55ce", "wba" ]
stm32wba55cg = [ "embassy-stm32/stm32wba55cg", "wba" ]
stm32wba55he = [ "embassy-stm32/stm32wba55he", "wba" ]
stm32wba55hg = [ "embassy-stm32/stm32wba55hg", "wba" ]
stm32wba55ue = [ "embassy-stm32/stm32wba55ue", "wba" ]
stm32wba55ug = [ "embassy-stm32/stm32wba55ug", "wba" ]
stm32wba62cg = [ "embassy-stm32/stm32wba62cg", "wba" ]
